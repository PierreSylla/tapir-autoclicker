name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the versions
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          pkgver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$pkgver" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, pyproject.toml ($version) and PKGBUILD ($pkgver) must give the same version"
            exit 1
          fi
      - name: Test
        # The tests do not need Qt, so PySide6 is left out.
        run: |
          pip install evdev tomli-w pytest
          python -m pytest
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tapir-autoclicker
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this job's OIDC token instead of an API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
