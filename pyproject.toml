[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapir-autoclicker"
version = "0.1.0"
description = "Small Wayland-friendly autoclicker with a Qt UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.5", "evdev>=1.6", "tomli-w>=1.0"]

[project.scripts]
tapir = "tapir.ipc:main"

[tool.setuptools.packages.find]
include = ["tapir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
