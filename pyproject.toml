[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tapir-autoclicker"
version = "0.2.0"
description = "Small Wayland-friendly autoclicker with a Qt UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pierre Sylla" }]
keywords = ["autoclicker", "wayland", "hyprland", "uinput"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.5", "evdev>=1.6", "tomli-w>=1.0"]

[project.urls]
Homepage = "https://github.com/PierreSylla/tapir-autoclicker"
Issues = "https://github.com/PierreSylla/tapir-autoclicker/issues"

[project.scripts]
tapir = "tapir.ipc:main"

[tool.setuptools.packages.find]
include = ["tapir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
